name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare icon
        run: |
          mkdir -p assets
          convert www/icon.png -resize 1024x1024 assets/icon.png

      - name: Install dependencies
        run: |
          npm install
          V=$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor/geolocation@$V

      - run: npx cap add android
      - run: npx capacitor-assets generate
      - run: npx cap sync android

      - name: Add app permissions
        run: |
          F=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            if ! grep -q "android.permission.$P" $F; then
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" $F
            fi
          done

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: almuntasir-apk
          path: android/app/build/outputs/apk/debug/*.apk
