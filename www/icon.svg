      <path d="M136 318 L310 151 L281 200 L345 196 L260 312 Z" fill="#f5d47d" opacity="0.34"/>
    </g>

    <text x="256" y="420" text-anchor="middle" font-size="92" font-weight="700" letter-spacing="-6" fill="url(#gold)" stroke="#694f1f" stroke-width="2" paint-order="stroke fill" font-family="Georgia, 'Times New Roman', serif">Montasir</text>
  </g>
