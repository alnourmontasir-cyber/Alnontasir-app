    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.62"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="92" fill="url(#bg)" stroke="#6d5322" stroke-width="9"/>
  <rect x="28" y="28" width="456" height="456" rx="82" fill="#0a0b0d" opacity="0.94"/>
  <rect x="28" y="28" width="456" height="456" rx="82" fill="#0a0b0d" filter="url(#leather)" opacity="0.55"/>

  <g filter="url(#shadow)">
    <path d="M127 154 L182 216 L196 210 L272 104 L329 145 L253 250 L203 224 L164 258 Z" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M210 141 L323 256 L266 215 L257 146 L210 141 Z" fill="#f4d07f" opacity="0.35"/>

    <g transform="translate(132 86)">
      <path d="M117 11 L146 79 L216 88 L163 132 L183 201 L117 162 L51 201 L71 132 L18 88 L88 79 Z" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="7" stroke-linejoin="round"/>
      <path d="M117 45 L137 92 L188 97 L150 131 L162 178 L117 152 L72 178 L84 131 L46 97 L97 92 Z" fill="#f8eebd" opacity="0.3"/>
    </g>

