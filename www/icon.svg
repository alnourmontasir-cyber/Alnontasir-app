<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Montasir logo">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9efbf"/>
      <stop offset="12%" stop-color="#e7c870"/>
      <stop offset="36%" stop-color="#f0d58a"/>
      <stop offset="52%" stop-color="#bc8d35"/>
      <stop offset="74%" stop-color="#f6e8b2"/>
      <stop offset="100%" stop-color="#7d5c2a"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f5df9a"/>
      <stop offset="100%" stop-color="#7a5628"/>
    </linearGradient>
    <filter id="leather" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.1"/>
