<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Almuntasir</title>

<style>
:root{
    --bg:#0B1220;
    --surface:#131C2E;
    --surface2:#1A2540;
    --text:#EFE6D2;
    --muted:#93A0B8;
    --accent:#3DDBB0;
    --gold:#E3BD62;
    --border:rgba(255,255,255,.08);
    --danger:#FF7070;
    --shadow:0 12px 35px rgba(0,0,0,.22);
    --radius:20px;
}

[data-theme="light"]{
    --bg:#F3EEE2;
    --surface:#FFFFFF;
    --surface2:#EAE3D2;
    --text:#1B2233;
    --muted:#6B7488;
    --accent:#0F9D7A;
    --gold:#A8801F;
    --border:rgba(0,0,0,.08);
    --danger:#D94C4C;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
}

button,input,textarea,select{
    font:inherit;
}

button{
    color:inherit;
    border:0;
    background:none;
    cursor:pointer;
}

#app{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:18px 15px 110px;
}

svg{
    width:24px;
    height:24px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.logo{
    width:58px;
    height:58px;
    border-radius:18px;
    background:linear-gradient(135deg,var(--accent),var(--gold));
    color:#06241C;
    display:grid;
    place-items:center;
    font-size:25px;
    font-weight:900;
    flex:none;
}

.top h1{
    margin:0;
    font-size:27px;
}

.top p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:13px;
}

.sp{
    flex:1;
}

.icon-btn{
    width:44px;
    height:44px;
    border-radius:14px;
    background:var(--surface);
    border:1px solid var(--border);
    display:grid;
    place-items:center;
}

.search{
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    outline:none;
    margin-bottom:15px;
}

.search:focus,
.input:focus,
.select:focus,
.textarea:focus{
    border-color:var(--accent);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:20px;
}

.stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:17px;
    padding:12px 8px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:19px;
}

.stat span{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.section-title{
    margin:20px 0 11px;
    font-size:17px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.folder{
    position:relative;
    min-height:140px;
    padding:14px 11px;
    border-radius:20px;
    background:var(--surface);
    border:1px solid var(--border);
    overflow:hidden;
    text-align:left;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.folder:active{
    transform:scale(.97);
}

.folder::after{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    background:var(--color);
    opacity:.11;
    left:-28px;
    top:-28px;
}

.folder-icon{
    width:46px;
    height:46px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:color-mix(in srgb,var(--color) 17%,transparent);
    color:var(--color);
    position:relative;
    z-index:1;
}

.folder b{
    display:block;
    font-size:13px;
    margin-top:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.folder small{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:4px;
}

.list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.item{
    width:100%;
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px;
    border-radius:18px;
    background:var(--surface);
    border:1px solid var(--border);
    text-align:left;
}

.thumbnail{
    width:53px;
    height:53px;
    border-radius:14px;
    background:var(--surface2);
    display:grid;
    place-items:center;
    overflow:hidden;
    flex:none;
    color:var(--muted);
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.item-text{
    min-width:0;
    flex:1;
}

.item-text b{
    display:block;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.item-text small{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.badges{
    display:flex;
    gap:5px;
    margin-top:5px;
}

.badge{
    padding:2px 7px;
    border-radius:8px;
    font-size:10px;
    background:var(--surface2);
    color:var(--muted);
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:45px 20px;
    line-height:1.8;
}

.fab{
    position:fixed;
    bottom:calc(20px + env(safe-area-inset-bottom));
    left:20px;
    background:var(--accent);
    color:#06241C;
    font-weight:800;
    padding:14px 20px;
    border-radius:18px;
    box-shadow:0 10px 28px rgba(61,219,176,.28);
    display:flex;
    align-items:center;
    gap:7px;
    z-index:10;
}

.backbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.backbar h2{
    margin:0;
    font-size:21px;
}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:15px;
    margin-bottom:12px;
}

.card-title{
    margin:0 0 12px;
    color:var(--gold);
    font-size:14px;
}

.input,
.select,
.textarea{
    width:100%;
    padding:13px 14px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    outline:none;
    margin-bottom:10px;
}

.textarea{
    min-height:190px;
    resize:vertical;
    line-height:1.7;
}

.row{
    display:flex;
    gap:9px;
}

.btn{
    flex:1;
    padding:13px 12px;
    border-radius:14px;
    background:var(--surface2);
    color:var(--text);
    font-weight:700;
    text-align:center;
    border:1px solid transparent;
}

.btn.primary{
    background:var(--accent);
    color:#06241C;
}

.btn.danger{
    background:rgba(255,90,90,.14);
    color:var(--danger);
}

.btn.gold{
    background:rgba(227,189,98,.13);
    color:var(--gold);
}

.actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.action{
    width:40px;
    height:40px;
    border-radius:12px;
    background:var(--surface2);
    display:grid;
    place-items:center;
}

.action svg{
    width:19px;
    height:19px;
}

.preview{
    max-width:100%;
    max-height:60vh;
    display:block;
    margin:0 auto 12px;
    border-radius:16px;
}

.note-view{
    white-space:pre-wrap;
    line-height:1.8;
    background:var(--bg);
    border:1px solid var(--border);
    padding:15px;
    border-radius:16px;
    max-height:60vh;
    overflow:auto;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:1000;
}

.sheet{
    width:100%;
    max-width:700px;
    max-height:92vh;
    overflow:auto;
    background:var(--surface);
    border-radius:27px 27px 0 0;
    padding:21px 18px calc(22px + env(safe-area-inset-bottom));
    border:1px solid var(--border);
}

.sheet h3{
    margin:0 0 15px;
    font-size:19px;
}

.toast{
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:var(--surface2);
    color:var(--text);
    padding:10px 17px;
    border-radius:14px;
    z-index:2000;
    box-shadow:var(--shadow);
    font-size:13px;
    white-space:nowrap;
}

.lock{
    position:fixed;
    inset:0;
    z-index:3000;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:30px;
}

.lock-logo{
    width:100px;
    height:100px;
    border-radius:28px;
    background:linear-gradient(135deg,var(--accent),var(--gold));
    color:#06241C;
    display:grid;
    place-items:center;
    font-size:42px;
    font-weight:900;
}

.lock h2{
    margin:0;
}

.lock p{
    color:var(--muted);
    text-align:center;
}

.pin-input{
    max-width:270px;
    text-align:center;
    font-size:22px;
    letter-spacing:7px;
}

.switch-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 0;
}

.switch{
    position:relative;
    width:48px;
    height:28px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:var(--surface2);
    border-radius:30px;
}

.slider::before{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:var(--muted);
    transition:.2s;
}

.switch input:checked + .slider{
    background:var(--accent);
}

.switch input:checked + .slider::before{
    transform:translateX(20px);
    background:#06241C;
}

@media(max-width:430px){
    #app{
        padding-left:12px;
        padding-right:12px;
    }

    .grid{
        gap:8px;
    }

    .folder{
        min-height:132px;
        padding:13px 9px;
    }

    .folder b{
        font-size:12px;
    }

    .top h1{
        font-size:24px;
    }
}
</style>
</head>
