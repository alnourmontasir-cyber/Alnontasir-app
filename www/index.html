<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080c1c">
<title>تـ𝓣𝓻𝓪𝓶𝓪ـرامـا SD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--fs:1;--a1:#7c5cff;--a2:#00c2ff;--cols:2}
[data-theme=dark]{--bg:#080c1c;--panel:#10162f;--card:rgba(255,255,255,.065);--txt:#f3f5ff;--mut:#99a2c9;--line:rgba(255,255,255,.11);--sh:0 14px 34px -14px rgba(0,0,0,.7)}
[data-theme=light]{--bg:#f2f3fb;--panel:#fbfbff;--card:rgba(255,255,255,.82);--txt:#141a36;--mut:#646b92;--line:rgba(20,26,60,.11);--sh:0 14px 30px -16px rgba(60,70,150,.35)}
html{font-size:calc(16px*var(--fs));background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;line-height:1.5;overflow-x:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit}
#bg{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:
radial-gradient(38% 30% at 82% 12%,rgba(124,92,255,.5),transparent 70%),
radial-gradient(34% 28% at 12% 30%,rgba(0,194,255,.38),transparent 70%),
radial-gradient(36% 30% at 90% 68%,rgba(255,61,129,.34),transparent 70%),
radial-gradient(34% 28% at 15% 92%,rgba(34,197,94,.3),transparent 70%),
radial-gradient(28% 22% at 55% 50%,rgba(251,191,36,.16),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
[data-theme=light] #bg{opacity:.5}
@keyframes drift{to{transform:translate3d(-4%,3%,0) rotate(6deg) scale(1.05)}}
.noanim *,.noanim #bg{animation:none!important;transition:none!important}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.brand,.ftop{display:flex;align-items:center;gap:12px}
.bt{flex:1;min-width:0}
.bt h1{font-size:1.28rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt p{font-size:.78rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:54px;height:54px;border-radius:19px;overflow:hidden;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-weight:800;font-size:1.35rem;color:#fff;box-shadow:0 10px 22px -8px var(--a1);flex:none}
.av img{width:100%;height:100%;object-fit:cover}
img:not([src]){visibility:hidden}
.ib{width:44px;height:44px;flex:none;border-radius:15px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;backdrop-filter:blur(14px);transition:transform .15s}
.ib:active{transform:scale(.92)}
.hero{margin:18px 0;border-radius:28px;padding:18px;background:linear-gradient(120deg,var(--a1),var(--a2));color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.17);top:-70px;left:-50px}
.hero:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);bottom:-50px;right:30px}
.hero p{position:relative;font-weight:700;font-size:1.02rem}
.stats{position:relative;display:flex;gap:10px;margin-top:12px}
.stats div{flex:1;background:rgba(255,255,255,.2);border-radius:16px;padding:9px 6px;text-align:center;backdrop-filter:blur(8px);font-size:.75rem}
.stats b{display:block;font-size:1.35rem;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:14px}
.tile{position:relative;aspect-ratio:1/1.02;border-radius:28px;padding:15px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:transform .18s;text-align:right}
.tile:active{transform:scale(.95)}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--g1),var(--g2));opacity:.17}
.tile .ico{position:absolute;top:15px;right:15px;width:60px;height:60px;border-radius:21px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;box-shadow:0 12px 24px -8px var(--g2)}
[data-cols="3"] .tile .ico{width:46px;height:46px;border-radius:16px}
[data-cols="3"] .tile{padding:11px}
.tile b{position:relative;font-size:1.02rem;font-weight:800;line-height:1.3}
.tile small{position:relative;color:var(--mut);font-size:.76rem}
.tile .edit{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.tile .lk{position:absolute;bottom:13px;left:13px;color:var(--mut)}
.tile.add{align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);background:transparent;box-shadow:none;color:var(--mut)}
.tile.add:before{display:none}
.foot{text-align:center;color:var(--mut);font-size:.78rem;margin-top:22px}
.fh{padding-top:calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:3;background:linear-gradient(var(--bg) 78%,transparent);padding-bottom:6px;margin:0 -16px;padding-inline:16px}
.fic{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 22px -8px var(--g2);flex:none}
.sr{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 13px;color:var(--mut)}
.sr input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font:inherit;padding:12px 0}
.grow{flex:1;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.85rem;color:var(--mut)}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent}
.cards{column-count:2;column-gap:12px;margin-top:10px}
.card{break-inside:avoid;margin-bottom:12px;border-radius:22px;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .th{position:relative;aspect-ratio:1;background:rgba(120,130,180,.18);display:grid;place-items:center;color:#fff}
.card .th img,.card .th video{width:100%;height:100%;object-fit:cover}
.card .th.au{background:linear-gradient(135deg,var(--g1),var(--g2))}
.card .pl{position:absolute;inset:auto auto 8px 8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;backdrop-filter:blur(6px)}
.card h3{font-size:.94rem;padding:10px 12px 0;line-height:1.4;word-break:break-word}
.card small{display:flex;align-items:center;gap:5px;padding:2px 12px 12px;color:var(--mut);font-size:.74rem}
.tx{padding:14px 14px 0;color:var(--mut);font-size:.82rem;line-height:1.75;max-height:8.5em;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.tx.poem{text-align:center}
.tx.code{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem}
.empty{text-align:center;color:var(--mut);padding:60px 20px}
.empty svg{opacity:.5;margin-bottom:10px}
.empty b{display:block;color:var(--txt);font-size:1.05rem}
.fab{position:fixed;left:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:23px;background:linear-gradient(135deg,var(--g1,var(--a1)),var(--g2,var(--a2)));color:#fff;display:grid;place-items:center;box-shadow:0 16px 32px -8px var(--g2,var(--a1));z-index:5;transition:transform .15s}
.fab:active{transform:scale(.9)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sheet .dim{position:absolute;inset:0;background:rgba(4,7,18,.6);opacity:0;transition:opacity .25s;backdrop-filter:blur(4px)}
.sheet .panel{position:relative;width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--panel);border-radius:30px 30px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line)}
.sheet.on{pointer-events:auto}
.sheet.on .dim{opacity:1}
.sheet.on .panel{transform:none}
.sheet.full .panel{height:100%;max-height:none;border-radius:0;border:0;padding-top:calc(12px + env(safe-area-inset-top))}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 14px}
.sh{font-size:1.15rem;font-weight:800;margin-bottom:12px}
.eh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.eh .sh{flex:1;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h4{font-size:.85rem;color:var(--mut);margin:16px 0 8px;font-weight:600}
.mut{color:var(--mut);line-height:1.8}
.inp{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:16px;padding:13px 14px;font:inherit;outline:0;margin-bottom:10px}
.inp:focus{border-color:var(--a1)}
.ta{min-height:52vh;resize:none;line-height:1.9}
.ta.poem{text-align:center;font-size:1.08rem}
.ta.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:16px;padding:13px 18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 12px 24px -12px var(--a1)}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ff4d6d,#c9184a);box-shadow:none}
.btn.sm{padding:10px 15px;border-radius:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.acts .btn{flex:1;min-width:120px}
.addg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.addg button{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:right;font-weight:700}
.addg span{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 20px -8px var(--g2)}
.ipk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ipk button{aspect-ratio:1;border-radius:15px;border:2px solid transparent;background:var(--card);display:grid;place-items:center}
.ipk .sel{border-color:var(--txt)}
.cpk button{border-radius:50%}
.prev{display:grid;place-items:center;margin:4px 0 14px}
.pv{width:78px;height:78px;border-radius:27px;display:grid;place-items:center;color:#fff;box-shadow:0 16px 30px -10px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row span{display:flex;align-items:center;gap:8px}
.set{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:8px 15px 12px;margin-top:14px;backdrop-filter:blur(14px)}
.set h2{display:flex;align-items:center;gap:10px;font-size:1.02rem;padding:10px 0}
.sic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff}
.sw{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw.on:after{right:25px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{padding:7px 13px;border-radius:11px;color:var(--mut);font-size:.88rem}
.seg .on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.sws{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0 10px}
.swc{width:40px;height:40px;border-radius:14px;border:3px solid transparent}
.swc.on{border-color:var(--txt)}
.prof{display:flex;align-items:center;gap:14px;padding:6px 0 14px}
.avb{position:relative;width:78px;height:78px;border-radius:26px;flex:none}
.avb .av{width:78px;height:78px;border-radius:26px;font-size:1.9rem}
.avb i{position:absolute;bottom:-4px;left:-4px;width:30px;height:30px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.prof small{color:var(--mut)}
.fld{display:block;font-size:.83rem;color:var(--mut);margin-bottom:4px}
.fld .inp{margin:5px 0 10px;color:var(--txt)}
.rng{width:150px;accent-color:var(--a1)}
.big{width:100%;max-height:62vh;object-fit:contain;border-radius:22px;background:rgba(0,0,0,.35)}
.disc{width:150px;height:150px;border-radius:50%;margin:20px auto;display:grid;place-items:center;color:#fff;background:conic-gradient(from 0deg,#ff3d81,#ffb02e,#22c55e,#00c2ff,#7c5cff,#ff3d81);box-shadow:0 20px 40px -14px var(--a1);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
audio{width:100%;margin-top:8px}
.cap{margin-top:14px;color:var(--mut);line-height:1.9;white-space:pre-wrap}
.body{white-space:pre-wrap;line-height:2;font-size:1.06rem;word-break:break-word}
.body.poem{text-align:center;font-size:1.18rem}
.code{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.84rem;line-height:1.7;background:#0a0f22;color:#e6eaff;padding:14px;border-radius:18px;overflow:auto;white-space:pre}
.res{display:flex;align-items:center;gap:12px;padding:11px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:9px}
.res .sic{width:42px;height:42px;border-radius:15px}
.res b{display:block;font-size:.95rem}
.res small{color:var(--mut)}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;overflow:auto}
#lock:before{content:"";position:fixed;inset:0;background:radial-gradient(40% 30% at 80% 15%,rgba(124,92,255,.5),transparent 70%),radial-gradient(40% 30% at 15% 85%,rgba(0,194,255,.4),transparent 70%),radial-gradient(35% 28% at 85% 80%,rgba(255,61,129,.3),transparent 70%)}
.pin .panel{display:grid;place-items:center;background:var(--bg)}
.padbox{position:relative;text-align:center;padding:24px}
.padbox h2{font-size:1.3rem;margin-top:12px}
.padbox p{color:var(--mut);margin:4px 0 18px;min-height:1.5em}
.lockic{width:66px;height:66px;border-radius:24px;margin:0 auto;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 14px 28px -10px var(--a1)}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:22px;min-height:16px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--mut);transition:transform .15s}
.dots i.f{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;transform:scale(1.1)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;direction:ltr}
.keys button{height:72px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:1.5rem;font-weight:600;display:grid;place-items:center;backdrop-filter:blur(10px)}
.keys button:active{background:var(--a1);color:#fff}
.lnk{display:block;margin:16px auto 0;color:var(--mut);padding:8px 14px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(17,24,39,.94);color:#fff;padding:10px 18px;border-radius:15px;opacity:0;transition:.25s;z-index:70;pointer-events:none;font-size:.9rem;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<div id="sheets"></div>
<div id="lock" hidden></div>
<div id="toast"></div>
<input type="file" id="fi" hidden>
<script>
