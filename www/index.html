<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12151b">
<title>المنتصر</title>

<style>
:root{
  --bg:#12151b;
  --bg-elev:#191d25;
  --surface:#1f2430;
  --surface-2:#262c3a;
  --border:#31394a;
  --text:#edeee8;
  --text-dim:#9aa2b5;
  --gold:#c9a24b;
  --gold-dim:#8a733a;
  --danger:#c65a4d;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

button,input,textarea{
  font-family:inherit;
}

button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
}

input,textarea{
  width:100%;
  background:var(--surface-2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  font-size:15px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus{
  outline:2px solid var(--gold);
}

.hidden{
  display:none!important;
}

/* SCREENS */

.screen{
  display:none;
  min-height:100vh;
  padding:18px 16px 100px;
}

.screen.active{
  display:block;
}

/* HEADER */

.top-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 2px 20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar,
.avatar-fallback{
  width:52px;
  height:52px;
  border-radius:16px;
}

.avatar{
  object-fit:cover;
  border:1px solid var(--border);
}

.avatar-fallback{
  background:linear-gradient(155deg,var(--gold),var(--gold-dim));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
  color:#12151b;
}

.brand h1{
  margin:0;
  font-size:20px;
  font-weight:900;
}

.brand p{
  margin:3px 0 0;
  color:var(--text-dim);
  font-size:12px;
}

.icon-btn{
  width:43px;
  height:43px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:active{
  transform:scale(.94);
}

.icon-btn svg{
  width:20px;
  height:20px;
}

/* FOLDERS */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.folder-card{
  position:relative;
  overflow:hidden;
  min-height:135px;
  padding:16px;
  text-align:right;
  border-radius:var(--radius-lg);
  border:1px solid var(--border);
  background:linear-gradient(160deg,var(--surface),var(--surface-2));
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:.12s;
}

.folder-card:active{
  transform:scale(.96);
}

.folder-card::after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  top:-35px;
  inset-inline-end:-35px;
  border-radius:50%;
  background:var(--fc);
  opacity:.13;
}

.folder-icon{
  width:47px;
  height:47px;
  border-radius:14px;
  background:linear-gradient(155deg,var(--fc),var(--fc2));
  display:flex;
  align-items:center;
  justify-content:center;
}

.folder-icon svg{
  width:23px;
  height:23px;
}

.folder-card h3{
  margin:0 0 4px;
  font-size:14px;
}

.folder-card span{
  font-size:11.5px;
  color:var(--text-dim);
}

/* DETAIL */

.detail-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.detail-header h2{
  margin:0;
  flex:1;
  font-size:19px;
  font-weight:900;
}

.item-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.item-card{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:13px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
}

.item-thumb{
  width:48px;
  height:48px;
  flex-shrink:0;
  border-radius:11px;
  background:var(--surface-2);
  object-fit:cover;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold);
}

.item-body{
  flex:1;
  min-width:0;
}

.item-body h4{
  margin:0 0 4px;
  font-size:14.5px;
}

.item-body p{
  margin:0;
  color:var(--text-dim);
  font-size:12.5px;
  white-space:pre-wrap;
  word-break:break-word;
  max-height:65px;
  overflow:hidden;
}

.item-meta{
  margin-top:5px;
  font-size:10.5px;
  color:var(--text-dim);
}

.item-actions{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.item-actions button{
  width:31px;
  height:31px;
  border-radius:9px;
  background:var(--surface-2);
  display:flex;
  align-items:center;
  justify-content:center;
}

.item-actions svg{
  width:15px;
  height:15px;
}

.empty-state{
  text-align:center;
  padding:70px 20px;
  color:var(--text-dim);
}

.empty-state svg{
  width:50px;
  height:50px;
  margin-bottom:12px;
  opacity:.5;
}

.empty-state p{
  margin:0;
  font-size:14px;
}

/* FAB */

.fab{
  display:none;
  position:fixed;
  bottom:25px;
  inset-inline-end:22px;
  width:59px;
  height:59px;
  border-radius:50%;
  background:linear-gradient(155deg,var(--gold),var(--gold-dim));
  box-shadow:var(--shadow);
  align-items:center;
  justify-content:center;
  z-index:100;
}

.fab.show{
  display:flex;
}

.fab svg{
  width:25px;
  height:25px;
  color:#12151b;
}

/* MODALS */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.55);
}

.modal-backdrop.active{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:88vh;
  overflow-y:auto;
  padding:20px 18px calc(22px + env(safe-area-inset-bottom));
  border-radius:24px 24px 0 0;
  background:var(--bg-elev);
  border-top:1px solid var(--border);
}

.modal-handle{
  width:40px;
  height:4px;
  margin:0 auto 15px;
  border-radius:3px;
  background:var(--border);
}

.modal h3{
  margin:0 0 16px;
  font-size:17px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin-bottom:6px;
  color:var(--text-dim);
  font-size:12.5px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:8px;
}

.btn{
  flex:1;
  padding:13px;
  border-radius:var(--radius-sm);
  font-size:14px;
  font-weight:700;
  text-align:center;
}

.btn-primary{
  background:var(--gold);
  color:#12151b;
}

.btn-ghost{
  background:var(--surface-2);
  color:var(--text);
}

.btn-danger{
  background:var(--danger);
  color:#fff;
}

/* SETTINGS */

.settings-group{
  margin-bottom:14px;
  padding:15px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:var(--surface);
}

.settings-group h4{
  margin:0 0 12px;
  color:var(--text-dim);
  font-size:12.5px;
}

.avatar-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
}

.avatar-big{
  width:74px;
  height:74px;
  border-radius:20px;
  object-fit:cover;
}

.switch-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 0;
}

.switch{
  position:relative;
  width:48px;
  height:28px;
  border-radius:20px;
  background:var(--surface-2);
  border:1px solid var(--border);
}

.switch::after{
  content:"";
  position:absolute;
  top:3px;
  inset-inline-start:3px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--text-dim);
  transition:.2s;
}

.switch.on{
  background:var(--gold);
}

.switch.on::after{
  inset-inline-start:23px;
  background:#12151b;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  z-index:600;
  padding:11px 20px;
  border-radius:30px;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
}

/* PIN */

#lockScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  background:var(--bg);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:17px;
  padding:25px;
}

#lockScreen.active{
  display:flex;
}

.lock-emblem{
  width:76px;
  height:76px;
  border-radius:50%;
  background:linear-gradient(155deg,var(--gold),var(--gold-dim));
  display:flex;
  align-items:center;
  justify-content:center;
}

.lock-emblem svg{
  width:40px;
  height:40px;
}

.pin-dots{
  display:flex;
  gap:13px;
}

.pin-dot{
  width:14px;
  height:14px;
  border-radius:50%;
  border:2px solid var(--gold-dim);
}

.pin-dot.filled{
  background:var(--gold);
}

.pin-pad{
  display:grid;
  grid-template-columns:repeat(3,68px);
  gap:13px;
}

.pin-key{
  width:68px;
  height:68px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  font-size:22px;
  font-weight:700;
}

.pin-key:active{
  background:var(--surface-2);
}

#lockError{
  min-height:18px;
  color:var(--danger);
  font-size:13px;
}

/* MEDIA */

.preview{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:12px;
  margin-top:10px;
  background:#000;
}

.file-label{
  display:block;
  padding:20px;
  text-align:center;
  border:1.5px dashed var(--border);
  border-radius:15px;
  color:var(--text-dim);
}

.file-label input{
  display:none;
}
</style>
</head>

<body>

<!-- ================= LOCK ================= -->

<div id="lockScreen">

  <div class="lock-emblem">
    <svg viewBox="0 0 24 24" fill="none" stroke="#12151b" stroke-width="2">
      <path d="M12 2l7 3v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V5l7-3z"/>
    </svg>
  </div>

  <div style="text-align:center">
    <h2 id="lockAppName" style="margin:0 0 4px">المنتصر</h2>
    <p style="margin:0;color:var(--text-dim);font-size:13px">
      أدخل رمز الدخول
    </p>
  </div>

  <div class="pin-dots" id="pinDots"></div>

  <div id="lockError"></div>

  <div class="pin-pad" id="pinPad"></div>

</div>


<!-- ================= HOME ================= -->

<div class="screen active" id="screen-home">

  <div class="top-header">

    <div class="brand">

      <img id="homeAvatarImg" class="avatar hidden">

      <div id="homeAvatarFallback" class="avatar-fallback">
        م
      </div>

      <div>
        <h1 id="homeAppName">المنتصر</h1>
        <p id="homeTagline">خزانتك الخاصة</p>
      </div>

    </div>

    <button class="icon-btn" onclick="openSettings()">

      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor"
           stroke-width="1.8">

        <circle cx="12" cy="12" r="3"/>

        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06
        a2 2 0 11-2.83 2.83l-.06-.06
        a1.65 1.65 0 00-1.82-.33
        1.65 1.65 0 00-1 1.51V21
        a2 2 0 01-4 0v-.09
        A1.65 1.65 0 009.6 19.4
        a1.65 1.65 0 00-1.82.33l-.06.06
        a2 2 0 11-2.83-2.83l.06-.06
        a1.65 1.65 0 00.33-1.82
        1.65 1.65 0 00-1.51-1H3
        a2 2 0 010-4h.09A1.65 1.65
        0 004.6 9.6a1.65 1.65 0 00-.33-1.82
        l-.06-.06a2 2 0 112.83-2.83l.06.06
        a1.65 1.65 0 001.82.33H9
        a1.65 1.65 0 001-1.51V3
        a2 2 0 014 0v.09a1.65 1.65
        0 001 1.51 1.65 1.65 0 001.82-.33
        l.06-.06a2 2 0 112.83 2.83l-.06.06
        a1.65 1.65 0 00-.33 1.82V9
        a1.65 1.65 0 001.51 1H21
        a2 2 0 010 4h-.09a1.65 1.65
        0 00-1.51 1z"/>

      </svg>

    </button>

  </div>


  <div class="grid" id="foldersGrid"></div>

</div>


<!-- ================= FOLDER ================= -->

<div class="screen" id="screen-folder">

  <div class="detail-header">

    <button class="icon-btn" onclick="goHome()">

      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2">

        <path d="M15 18l-6-6 6-6"/>

      </svg>

    </button>

    <h2 id="folderTitle"></h2>

    <button class="icon-btn">

      <span id="folderCountBadge"
            style="font-size:12px;color:var(--text-dim)">
      </span>

    </button>

  </div>

  <div class="item-list" id="itemList"></div>

</div>


<!-- ================= FAB ================= -->

<button class="fab" id="fabBtn" onclick="openAddModal()">

  <svg viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2.2">

    <path d="M12 5v14M5 12h14"/>

  </svg>

</button>


<!-- ================= SETTINGS ================= -->

<div class="screen" id="screen-settings">

  <div class="detail-header">

    <button class="icon-btn" onclick="goHome()">

      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2">

        <path d="M15 18l-6-6 6-6"/>

      </svg>

    </button>

    <h2>الإعدادات</h2>

  </div>


  <div class="settings-group">

    <h4>هوية التطبيق</h4>

    <div class="avatar-row">

      <img id="settingsAvatarImg"
           class="avatar-big hidden">

      <div id="settingsAvatarFallback"
           class="avatar-fallback"
           style="width:74px;height:74px;border-radius:20px;font-size:26px">
        م
      </div>

      <label class="btn btn-ghost"
             style="display:block;flex:1">

        تغيير الصورة

        <input type="file"
               id="avatarInput"
               accept="image/*"
               style="display:none">

      </label>

    </div>


    <div class="field">

      <label>اسم التطبيق</label>

      <input id="setAppName"
             placeholder="المنتصر">

    </div>


    <div class="field">

      <label>الشعار الفرعي</label>

      <input id="setTagline"
             placeholder="خزانتك الخاصة">

    </div>

  </div>


  <div class="settings-group">

    <h4>حول التطبيق</h4>

    <div class="field">

      <label>نبذة عن التطبيق</label>

      <textarea id="setAbout"
                placeholder="اكتب نبذة عن التطبيق"></textarea>

    </div>

    <div class="field">

      <label>الناشر</label>

      <input id="setPublisher"
             placeholder="اسم الناشر">

    </div>

    <div class="field">

      <label>الإصدار</label>

      <input id="setVersion"
             placeholder="1.0.0">

    </div>

  </div>


  <div class="settings-group">

    <h4>الحماية</h4>

    <div class="switch-row">

      <span>قفل برمز PIN</span>

      <button class="switch"
              id="pinToggle"
              onclick="togglePin()">
      </button>

    </div>

    <button class="btn btn-ghost"
            style="width:100%;margin-top:8px"
            onclick="startSetPin()">

      تعيين / تغيير الرمز

    </button>

  </div>


  <button class="btn btn-primary"
          style="width:100%"
          onclick="saveSettings()">

    حفظ الإعدادات

  </button>

</div>


<!-- ================= ADD MODAL ================= -->

<div class="modal-backdrop" id="addModalBackdrop">

  <div class="modal">

    <div class="modal-handle"></div>

    <h3 id="addModalTitle">إضافة</h3>

    <div id="addModalBody"></div>

    <div class="modal-actions">

      <button class="btn btn-ghost"
              onclick="closeAddModal()">

        إلغاء

      </button>

      <button class="btn btn-primary"
              onclick="submitAddItem()">

        حفظ

      </button>

    </div>

  </div>

</div>


<!-- ================= VIEW MODAL ================= -->

<div class="modal-backdrop" id="viewModalBackdrop">

  <div class="modal">

    <div class="modal-handle"></div>

    <div id="viewModalBody"></div>

    <div class="modal-actions">

      <button class="btn btn-ghost"
              onclick="closeViewModal()">

        إغلاق

      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   FOLDERS
========================================================= */

const FOLDERS = [

  {
    id:"code",
    name:"الأكواد",
    color:"#eab308",
    color2:"#b45309",
    type:"code",
    icon:"</>"
  },

  {
    id:"memories",
    name:"الذكريات",
    color:"#f59e0b",
    color2:"#b45309",
    type:"note",
    icon:"♥"
  },

  {
    id:"private",
    name:"ملفات خاصة",
    color:"#f43f5e",
    color2:"#9f1239",
    type:"file",
    icon:"✓"
  },

  {
    id:"projects",
    name:"مشاريع",
    color:"#3b82f6",
    color2:"#1d4ed8",
    type:"note",
    icon:"◆"
  },

  {
    id:"mymemory",
    name:"ذكرياتي",
    color:"#ec4899",
    color2:"#a21caf",
    type:"note",
    icon:"♥"
  },

  {
    id:"media",
    name:"الفيديوهات والصور",
    color:"#a855f7",
    color2:"#6d28d9",
    type:"media",
    icon:"▶"
  },

  {
    id:"tambour",
    name:"طمبور الشمال",
    color:"#f2994a",
    color2:"#c2570c",
    type:"note",
    icon:"♪"
  },

  {
    id:"other",
    name:"أخرى",
    color:"#64748b",
    color2:"#334155",
    type:"file",
    icon:"•••"
  }

];


/* =========================================================
   DATA
========================================================= */

let data = JSON.parse(
  localStorage.getItem("montasir_data") || "{}"
);

let settings = JSON.parse(
  localStorage.getItem("montasir_settings") || "{}"
);

let currentFolder = null;
let pinBuffer = "";
let pinMode = "";
let newPinBuffer = "";


/* =========================================================
   INITIAL DATA
========================================================= */

function initializeData(){

  FOLDERS.forEach(folder=>{

    if(!Array.isArray(data[folder.id])){
      data[folder.id] = [];
    }

  });

  saveData();

}

initializeData();


/* =========================================================
   STORAGE
========================================================= */

function saveData(){

  localStorage.setItem(
    "montasir_data",
    JSON.stringify(data)
  );

}

function saveSettingsData(){

  localStorage.setItem(
    "montasir_settings",
    JSON.stringify(settings)
  );

}


/* =========================================================
   HOME
========================================================= */

function renderHome(){

  const grid =
    document.getElementById("foldersGrid");

  grid.innerHTML = "";

  FOLDERS.forEach(folder=>{

    const count =
      data[folder.id]?.length || 0;

    const card =
      document.createElement("button");

    card.className = "folder-card";

    card.style.setProperty(
      "--fc",
      folder.color
    );

    card.style.setProperty(
      "--fc2",
      folder.color2
    );

    card.innerHTML = `

      <div class="folder-icon">

        <span style="
          color:white;
          font-size:${folder.id==="code"?"16px":"21px"};
          font-weight:900;
        ">
          ${folder.icon}
        </span>

      </div>

      <div>

        <h3>${escapeHTML(folder.name)}</h3>

        <span>
          ${count} ${count===1?"عنصر":"عناصر"}
        </span>

      </div>

    `;

    card.onclick = () =>
      openFolder(folder.id);

    grid.appendChild(card);

  });

}
