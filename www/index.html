<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>المنتصر</title>

<style>
:root{
 --bg:#0B1220;
 --sf:#131C2E;
 --sf2:#1A2540;
 --tx:#EFE6D2;
 --mut:#93A0B8;
 --ac:#3DDBB0;
 --gd:#E3BD62;
 --bd:rgba(255,255,255,.08);
 --danger:#FF7070;
 --shadow:0 12px 35px rgba(0,0,0,.22);
 --r:22px;
}

[data-theme="light"]{
 --bg:#F3EEE2;
 --sf:#FFFFFF;
 --sf2:#EAE3D2;
 --tx:#1B2233;
 --mut:#6B7488;
 --ac:#0F9D7A;
 --gd:#A8801F;
 --bd:rgba(0,0,0,.08);
 --danger:#D94C4C;
 --shadow:0 10px 30px rgba(40,30,10,.10);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
 margin:0;
 min-height:100%;
 background:var(--bg);
 color:var(--tx);
 font-family:"Noto Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif;
}

body{
 min-height:100vh;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
 overscroll-behavior-x:none;
}

button,input,textarea,select{font:inherit;}
button{color:inherit;border:0;background:none;cursor:pointer;}
a{color:inherit;}

#app{
 width:100%;
 max-width:700px;
 margin:auto;
 padding:16px 16px 100px;
}

svg{
 width:24px;
 height:24px;
 fill:none;
 stroke:currentColor;
 stroke-width:1.8;
 stroke-linecap:round;
 stroke-linejoin:round;
}

.top{display:flex;align-items:center;gap:12px;margin:5px 0 18px;}

.av{
 width:58px;
 height:58px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid var(--gd);
 box-shadow:0 0 0 5px rgba(227,189,98,.13);
 background:var(--sf2);
}

.top h1{margin:0;font-size:27px;font-weight:850;}
.top p{margin:2px 0 0;color:var(--mut);font-size:13px;}
.sp{flex:1;}

.ib{
 width:44px;
 height:44px;
 border-radius:14px;
 background:var(--sf);
 border:1px solid var(--bd);
 display:grid;
 place-items:center;
 flex:none;
}

.search{
 width:100%;
 padding:14px 16px;
 border-radius:16px;
 border:1px solid var(--bd);
 background:var(--sf);
 color:var(--tx);
 outline:none;
 margin-bottom:15px;
}

.search:focus,.inp:focus,.select:focus{border-color:var(--ac);}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}

.fc{
 position:relative;
 min-height:142px;
 padding:15px 12px;
 border-radius:20px;
 background:var(--sf);
 border:1px solid var(--bd);
 overflow:hidden;
 text-align:right;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
 box-shadow:0 5px 18px rgba(0,0,0,.05);
 transition:.15s;
}

.fc:active{transform:scale(.96);}

.fc::after{
 content:"";
 position:absolute;
 width:90px;
 height:90px;
 border-radius:50%;
 background:var(--c);
 opacity:.11;
 left:-28px;
 top:-28px;
}

.fi{
 width:46px;
 height:46px;
 border-radius:15px;
 display:grid;
 place-items:center;
 background:color-mix(in srgb,var(--c) 17%,transparent);
 color:var(--c);
 position:relative;
 z-index:1;
}

.fc b{display:block;font-size:14px;margin-top:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fc small{display:block;color:var(--mut);font-size:11px;margin-top:4px;}

.bar{display:flex;align-items:center;gap:11px;margin:5px 0 18px;}
.bar h2{margin:0;flex:1;font-size:21px;}

.list{display:flex;flex-direction:column;gap:9px;}

.it{
 width:100%;
 display:flex;
 align-items:center;
 gap:11px;
 padding:11px;
 border-radius:18px;
 background:var(--sf);
 border:1px solid var(--bd);
 text-align:right;
 box-shadow:0 4px 15px rgba(0,0,0,.04);
}

.th{
 width:53px;
 height:53px;
 border-radius:14px;
 background:var(--sf2);
 display:grid;
 place-items:center;
 overflow:hidden;
 flex:none;
 color:var(--mut);
}

.th img{width:100%;height:100%;object-fit:cover;}

.it .t{min-width:0;flex:1;}
.it b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.it small{display:block;color:var(--mut);font-size:11px;margin-top:4px;}

.badges{display:flex;gap:5px;margin-top:5px;}

.badge{
 padding:2px 7px;
 border-radius:8px;
 font-size:10px;
 background:var(--sf2);
 color:var(--mut);
}

.pin{color:var(--gd);}

.empty{
 text-align:center;
 color:var(--mut);
 padding:55px 20px;
 line-height:2;
}

.fab{
 position:fixed;
 bottom:calc(20px + env(safe-area-inset-bottom));
 left:20px;
 background:var(--ac);
 color:#06241C;
 font-weight:850;
 padding:14px 20px;
 border-radius:18px;
 box-shadow:0 10px 28px rgba(61,219,176,.28);
 display:flex;
 align-items:center;
 gap:7px;
 z-index:10;
}

.fab svg{width:21px;height:21px;}

.ov{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.58);
 display:flex;
 align-items:flex-end;
 justify-content:center;
 z-index:100;
}

.sh{
 width:100%;
 max-width:700px;
 max-height:92vh;
 overflow:auto;
 background:var(--sf);
 border-radius:27px 27px 0 0;
 padding:21px 18px calc(22px + env(safe-area-inset-bottom));
 border:1px solid var(--bd);
 box-shadow:var(--shadow);
}

.sh h3{margin:0 0 15px;font-size:19px;}

.inp,.select{
 width:100%;
 padding:13px 14px;
 border-radius:14px;
 border:1px solid var(--bd);
 background:var(--bg);
 color:var(--tx);
 outline:none;
 margin-bottom:10px;
}

textarea.inp{min-height:190px;resize:vertical;line-height:1.9;}

.row{display:flex;gap:9px;}

.btn{
 flex:1;
 padding:13px 12px;
 border-radius:14px;
 background:var(--sf2);
 color:var(--tx);
 font-weight:750;
 text-align:center;
 text-decoration:none;
 border:1px solid transparent;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:6px;
}

.btn.p{background:var(--ac);color:#06241C;}
.btn.d{background:rgba(255,90,90,.14);color:var(--danger);}
.btn.g{background:rgba(227,189,98,.13);color:var(--gd);}

.sec{
 background:var(--sf);
 border:1px solid var(--bd);
 border-radius:20px;
 padding:15px;
 margin-bottom:12px;
}

.sec h4{margin:0 0 11px;color:var(--gd);font-size:14px;}

.sec label{display:block;color:var(--mut);font-size:12px;margin:7px 0 5px;}

.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}

.switch{position:relative;width:48px;height:28px;}
.switch input{display:none;}

.slider{
 position:absolute;
 inset:0;
 background:var(--sf2);
 border-radius:30px;
}

.slider:before{
 content:"";
 position:absolute;
 width:22px;
 height:22px;
 right:3px;
 top:3px;
 border-radius:50%;
 background:var(--mut);
 transition:.2s;
}

.switch input:checked+.slider{background:var(--ac);}
.switch input:checked+.slider:before{transform:translateX(-20px);background:#06241C;}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-bottom:15px;
}

.stat{
 background:var(--sf);
 border:1px solid var(--bd);
 border-radius:17px;
 padding:12px 8px;
 text-align:center;
}

.stat b{display:block;font-size:19px;}
.stat span{display:block;color:var(--mut);font-size:10px;margin-top:3px;}

.actions{display:flex;gap:7px;}

.action{
 width:38px;
 height:38px;
 border-radius:12px;
 background:var(--sf2);
 display:grid;
 place-items:center;
 flex:none;
}

.action svg{width:19px;height:19px;}

.pv{
 max-width:100%;
 max-height:58vh;
 display:block;
 margin:0 auto 12px;
 border-radius:16px;
}

.noteView{
 white-space:pre-wrap;
 line-height:2;
 background:var(--bg);
 border:1px solid var(--bd);
 padding:15px;
 border-radius:16px;
 max-height:60vh;
 overflow:auto;
}

.toast{
 position:fixed;
 bottom:90px;
 left:50%;
 transform:translateX(-50%);
 background:var(--sf2);
 color:var(--tx);
 padding:10px 17px;
 border-radius:14px;
 z-index:2000;
 box-shadow:var(--shadow);
 font-size:13px;
 white-space:nowrap;
}

.context{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;}

.contextBox{
 width:100%;
 max-width:700px;
 margin:auto auto 0;
 background:var(--sf);
 border-radius:25px 25px 0 0;
 padding:15px 15px calc(15px + env(safe-area-inset-bottom));
}

.context button{
 width:100%;
 text-align:right;
 padding:14px;
 border-radius:13px;
 margin:3px 0;
 background:var(--sf2);
}

.context .danger{color:var(--danger);}

.lock{
 position:fixed;
 inset:0;
 z-index:1000;
 background:var(--bg);
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:14px;
 padding:30px;
}

.lock .av{width:105px;height:105px;}

.lock .inp{
 max-width:270px;
 text-align:center;
 font-size:22px;
 letter-spacing:7px;
}

@media(max-width:430px){
 #app{padding-left:12px;padding-right:12px;}
 .grid{gap:8px;}
 .fc{min-height:132px;padding:13px 9px;}
 .fc b{font-size:12px;}
 .fc small{font-size:10px;}
 .top h1{font-size:24px;}
}

@media(prefers-reduced-motion:reduce){
 *{transition:none!important;}
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* =========================================================
   ALMUNTASIR - Local Personal Storage Application
   ========================================================= */

const IC={
code:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
brief:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
star:'<polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3"/>',
music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
back:'<polyline points="9 18 15 12 9 6"/>',
plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
note:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
pin:'<path d="M12 17v5"/><path d="M5 3h14l-2 6 2 3H5l2-3z"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>',
moon:'<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8z"/>',
info:'<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="7" x2="12.01" y2="7"/>',
folder:'<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
x:'<line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>',
edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'
};

const svg = n => `<svg viewBox="0 0 24 24">${IC[n]||IC.grid}</svg>`;

const EMAIL = 'alnourmontasir@gmail.com';

const DEFAULT_FOLDERS = [
 {id:'code',n:'الأكواد',i:'code',c:'#5EC8FF',fixed:true},
 {id:'mem',n:'الذكريات',i:'heart',c:'#FF7A9C',fixed:true},
 {id:'priv',n:'ملفات خاصة',i:'lock',c:'#B69CFF',fixed:true},
 {id:'proj',n:'مشاريع',i:'brief',c:'#FFC65C',fixed:true},
 {id:'mine',n:'ذكرياتي',i:'cam',c:'#5CE0B0',fixed:true},
 {id:'mnt',n:'منتصر',i:'star',c:'#F2D57E',fixed:true},
 {id:'tmb',n:'طمبور الشمال',i:'music',c:'#FF9F6B',fixed:true},
 {id:'oth',n:'أخرى',i:'grid',c:'#9FB0C8',fixed:true}
];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

/* ================= DATABASE ================= */

const DB = new Promise((resolve, reject) => {
 const r = indexedDB.open('almuntasir_v2', 2);

 r.onupgradeneeded = e => {
   const db = e.target.result;
   if(!db.objectStoreNames.contains('items')){
     db.createObjectStore('items', {keyPath:'id'});
   }
   if(!db.objectStoreNames.contains('folders')){
     db.createObjectStore('folders', {keyPath:'id'});
   }
 };

 r.onsuccess = () => resolve(r.result);
 r.onerror = () => reject(r.error);
});

async function storeTx(store, mode, fn){
 const db = await DB;
 return new Promise((resolve, reject) => {
   const t = db.transaction(store, mode);
   const s = t.objectStore(store);
   let request;
   try { request = fn(s); } catch(e){ reject(e); return; }
   t.oncomplete = () => resolve(request ? request.result : undefined);
   t.onerror = () => reject(t.error);
 });
}

const getItems = () => storeTx('items','readonly', s => s.getAll());
const putItem = o => storeTx('items','readwrite', s => s.put(o));
const deleteItemDB = id => storeTx('items','readwrite', s => s.delete(id));
const getFolders = () => storeTx('folders','readonly', s => s.getAll());
const putFolder = o => storeTx('folders','readwrite', s => s.put(o));

/* ================= SETTINGS ================= */

let cfg = Object.assign({
 theme:'dark',
 pin:'',
 publisher:'المنتصر',
 about:'مساحتك الخاصة لحفظ النصوص والصور والملفات.',
 version:'2.0.0',
 sort:'new'
}, JSON.parse(localStorage.getItem('cfg') || '{}'));

function saveCfg(){ localStorage.setItem('cfg', JSON.stringify(cfg)); }

function applyTheme(){
 document.documentElement.dataset.theme = cfg.theme;
 const meta = document.querySelector('meta[name="theme-color"]');
 if(meta) meta.content = cfg.theme === 'light' ? '#F3EEE2' : '#0B1220';
}
applyTheme();

/* ================= STATE ================= */

let state = {
 v:'home',
 f:null,
 folders:[],
 items:[],
 search:''
};

/* ================= HELPERS ================= */

function toast(message){
 const t = document.createElement('div');
 t.className = 'toast';
 t.textContent = message;
 document.body.appendChild(t);
 setTimeout(() => t.remove(), 1900);
}

function fmt(t){
 return new Date(t).toLocaleDateString('ar', {
   year:'numeric', month:'short', day:'numeric'
 });
}

function fmtTime(t){
 return new Date(t).toLocaleString('ar', {
   year:'numeric', month:'short', day:'numeric',
   hour:'2-digit', minute:'2-digit'
 });
}

function closeOv(){
 document.querySelectorAll('.ov,.context').forEach(e => e.remove());
}

function sheet(html){
 closeOv();
 const o = document.createElement('div');
 o.className = 'ov';
 o.innerHTML = `<div class="sh">${html}</div>`;
 o.addEventListener('click', e => { if(e.target === o) o.remove(); });
 document.body.appendChild(o);
 return o;
}

function getFolder(id){ return state.folders.find(f => f.id === id); }

function itemTypeName(i){
 if(i.type === 'note') return 'نص';
 if((i.mime || '').startsWith('image/')) return 'صورة';
 if((i.mime || '').startsWith('audio/')) return 'صوت';
 if((i.mime || '').startsWith('video/')) return 'فيديو';
 return 'ملف';
}

function sortItems(items){
 const arr = [...items];
 if(cfg.sort === 'name'){
   return arr.sort((a,b) => String(a.title).localeCompare(String(b.title),'ar'));
 }
 if(cfg.sort === 'old'){
   return arr.sort((a,b) => a.created - b.created);
 }
 return arr.sort((a,b) => {
   if(!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
   return b.created - a.created;
 });
}

/* ================= NAVIGATION ================= */

function nav(v, f = null){
 history.pushState({v, f}, '', location.href);
 state.v = v;
 state.f = f;
 closeOv();
 render();
}

addEventListener('popstate', e => {
 const s = e.state || {v:'home', f:null};
 state.v = s.v;
 state.f = s.f;
 closeOv();
 render();
});

history.replaceState({v:'home', f:null}, '', location.href);

/* ================= RENDER ================= */

function render(){
 const app = document.getElementById('app');
 if(!app) return;

 if(state.v === 'home') renderHome(app);
 else if(state.v === 'folder') renderFolder(app);
 else if(state.v === 'settings') renderSettings(app);
}

/* ---------- الصفحة الرئيسية ---------- */

function renderHome(app){
 const items = state.items.filter(i => !i.deleted);
 const pinned = items.filter(i => i.pinned);
 const recent = sortItems(items).slice(0, 20);

 app.innerHTML = `
   <div class="top">
     <img class="av" src="https://ui-avatars.com/api/?name=${encodeURIComponent(cfg.publisher||'المنتصر')}&background=3DDBB0&color=06241C" alt="">
     <div>
       <h1>المنتصر</h1>
       <p>${esc(cfg.about)}</p>
     </div>
     <div class="sp"></div>
     <button class="ib" onclick="nav('settings')">${svg('gear')}</button>
   </div>

   <input class="search" id="searchInput" placeholder="ابحث..." value="${esc(state.search)}">

   <div class="stats">
     <div class="stat"><b>${items.length}</b><span>عنصر</span></div>
     <div class="stat"><b>${state.folders.length}</b><span>مجلد</span></div>
     <div class="stat"><b>${pinned.length}</b><span>مثبت</span></div>
   </div>

   <h3 style="margin:5px 0 11px;font-size:17px">المجلدات</h3>
   <div class="grid">
     ${state.folders.map(f => {
       const count = items.filter(i => i.folder === f.id).length;
       return `
         <button class="fc" style="--c:${f.c}" onclick="openFolder('${f.id}')">
           <div class="fi">${svg(f.i)}</div>
           <div>
             <b>${esc(f.n)}</b>
             <small>${count} عنصر</small>
           </div>
         </button>
       `;
     }).join('')}
   </div>

   ${recent.length ? `
     <h3 style="margin:22px 0 11px;font-size:17px">أحدث العناصر</h3>
     <div class="list" id="recentList">
       ${recent.map(i => itemHTML(i)).join('')}
     </div>
   ` : `
     <div class="empty">
       لا توجد عناصر بعد<br>
       اضغط على زر الإضافة لإنشاء أول عنصر
     </div>
   `}

   <button class="fab" onclick="openAddSheet()">
     ${svg('plus')} إضافة
   </button>
 `;

 const si = document.getElementById('searchInput');
 if(si){
   si.oninput = e => {
     state.search = e.target.value.trim();
     renderSearchResults(app);
   };
 }
}

function renderSearchResults(app){
 const q = state.search.toLowerCase();
 const list = document.getElementById('recentList');
 if(!list) return;

 if(!q){
   const items = state.items.filter(i => !i.deleted);
   const recent = sortItems(items).slice(0, 20);
   list.innerHTML = recent.map(i => itemHTML(i)).join('');
   return;
 }

 const results = state.items.filter(i =>
   !i.deleted &&
   (String(i.title||'').toLowerCase().includes(q) ||
    String(i.body||'').toLowerCase().includes(q))
 );

 if(results.length){
   list.innerHTML = results.map(i => itemHTML(i)).join('');
 } else {
   list.innerHTML = `<div class="empty" style="padding:25px">لا نتائج</div>`;
 }
}

function itemHTML(i){
 const f = getFolder(i.folder);
 const thumb = i.data && (i.mime||'').startsWith('image/')
   ? `<img src="${i.data}" alt="">`
   : svg(i.type === 'note' ? 'note' : 'file');

 return `
   <button class="it" onclick="openItem('${i.id}')">
     <div class="th">${thumb}</div>
     <div class="t">
       <b>${i.pinned?'<span class="pin">★</span> ':''}${esc(i.title || 'بدون عنوان')}</b>
       <small>${esc(f?f.n:'—')} · ${fmt(i.created)}</small>
       <div class="badges">
         <span class="badge">${itemTypeName(i)}</span>
       </div>
     </div>
   </button>
 `;
}
