<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>المنتصر</title>
<style>
:root{
  --bg:#12151b;
  --bg-elev:#191d25;
  --surface:#1f2430;
  --surface-2:#262c3a;
  --border:#31394a;
  --text:#edeee8;
  --text-dim:#9aa2b5;
  --gold:#c9a24b;
  --gold-dim:#8a733a;
  --danger:#c65a4d;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f1e9;
    --bg-elev:#ffffff;
    --surface:#ffffff;
    --surface-2:#f0ece0;
    --border:#e1dbc9;
    --text:#1c1a14;
    --text-dim:#6e6753;
    --gold:#a9812f;
    --gold-dim:#c9a24b;
    --shadow: 0 10px 30px rgba(60,50,20,.12);
    color-scheme: light;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  overscroll-behavior:none;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer;}
input,textarea{font-family:inherit; color:inherit; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; width:100%; font-size:15px;}
textarea{resize:vertical; min-height:110px;}
input:focus,textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
.screen{display:none; min-height:100vh; padding:18px 16px 100px;}
.screen.active{display:block;}
.hidden{display:none !important;}

#lockScreen{display:none; position:fixed; inset:0; z-index:999; background:var(--bg); align-items:center; justify-content:center; flex-direction:column; gap:18px; padding:24px;}
#lockScreen.active{display:flex;}
.lock-emblem{width:74px;height:74px;border-radius:50%;background:linear-gradient(155deg,var(--gold),var(--gold-dim));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.pin-dots{display:flex; gap:14px; margin:8px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold-dim); background:transparent; transition:background .15s;}
.pin-dot.filled{background:var(--gold); border-color:var(--gold);}
.pin-pad{display:grid; grid-template-columns:repeat(3,68px); gap:14px;}
.pin-key{width:68px;height:68px;border-radius:50%;background:var(--surface); border:1px solid var(--border); font-size:22px; font-weight:700; display:flex;align-items:center;justify-content:center;}
.pin-key:active{background:var(--surface-2);}
#lockError{color:var(--danger); font-size:13px; min-height:18px;}

.top-header{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 18px;}
.brand{display:flex; align-items:center; gap:12px;}
.avatar{width:52px;height:52px;border-radius:16px;object-fit:cover;border:1px solid var(--border); background:var(--surface-2);}
.avatar-fallback{width:52px;height:52px;border-radius:16px;background:linear-gradient(155deg,var(--gold),var(--gold-dim)); display:flex;align-items:center;justify-content:center; font-weight:900; font-size:20px; color:#12151b;}
.brand h1{font-size:19px; margin:0; font-weight:900; letter-spacing:.2px;}
.brand p{margin:2px 0 0; font-size:12px; color:var(--text-dim);}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--surface); border:1px solid var(--border); display:flex;align-items:center;justify-content:center;}
.icon-btn svg{width:20px;height:20px;}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.folder-card{background:linear-gradient(160deg,var(--surface),var(--surface-2)); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; display:flex; flex-direction:column; gap:26px; min-height:128px; position:relative; overflow:hidden; text-align:right; transition:transform .12s;}
.folder-card:active{transform:scale(.97);}
.folder-card::after{content:""; position:absolute; inset-inline-end:-30px; top:-30px; width:90px; height:90px; border-radius:50%; background:var(--fc,var(--gold)); opacity:.14;}
.folder-icon{width:44px;height:44px;border-radius:13px; background:linear-gradient(155deg,var(--fc,var(--gold)),var(--fc2,var(--gold-dim))); display:flex;align-items:center;justify-content:center; box-shadow:0 6px 14px -4px var(--fc,transparent);}
.folder-icon svg{width:21px;height:21px;}
.folder-card h3{margin:0; font-size:14.5px; font-weight:700;}
.folder-card span{font-size:11.5px; color:var(--text-dim);}

.detail-header{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
.detail-header h2{margin:0; font-size:18px; font-weight:900; flex:1;}
.item-list{display:flex; flex-direction:column; gap:10px;}
.item-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; display:flex; gap:12px; align-items:flex-start;}
.item-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover; flex-shrink:0; background:var(--surface-2);}
.item-thumb.icon-thumb{display:flex;align-items:center;justify-content:center; color:var(--gold);}
.item-body{flex:1; min-width:0;}
.item-body h4{margin:0 0 3px; font-size:14.5px; font-weight:700;}
.item-body p{margin:0; font-size:12.5px; color:var(--text-dim); white-space:pre-wrap; word-break:break-word; max-height:60px; overflow:hidden;}
.item-body pre{margin:4px 0 0; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim); direction:ltr; text-align:left; max-height:60px; overflow:hidden; white-space:pre-wrap;}
.item-body .meta{font-size:10.5px; color:var(--text-dim); opacity:.7; margin-top:5px;}
.item-actions{display:flex; flex-direction:column; gap:6px;}
.item-actions button{width:30px;height:30px; border-radius:9px; background:var(--surface-2); display:flex;align-items:center;justify-content:center;}
.item-actions svg{width:15px;height:15px;}
.empty-state{text-align:center; padding:60px 20px; color:var(--text-dim);}
.empty-state svg{width:46px;height:46px; margin-bottom:12px; opacity:.5;}
.empty-state p{margin:0; font-size:13.5px;}

.fab{display:none; position:fixed; bottom:28px; inset-inline-end:22px; width:58px;height:58px;border-radius:50%; background:linear-gradient(155deg,var(--gold),var(--gold-dim)); box-shadow:var(--shadow); align-items:center;justify-content:center; z-index:50;}
.fab.show{display:flex;}
#diagBox{display:none; margin:16px 2px; padding:14px; border-radius:14px; background:#3a1f1f; border:1px solid #a44; color:#ffd9d3; font-size:12px; white-space:pre-wrap; direction:ltr; text-align:left;}
.fab svg{width:24px;height:24px; color:#12151b;}

.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:none; align-items:flex-end; justify-content:center;}
.modal-backdrop.active{display:flex;}
.modal{background:var(--bg-elev); width:100%; max-width:560px; border-radius:24px 24px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto; border-top:1px solid var(--border);}
.modal-handle{width:38px;height:4px;background:var(--border); border-radius:2px; margin:0 auto 14px;}
.modal h3{margin:0 0 14px; font-size:16.5px; font-weight:900;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px;}
.file-drop{border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:20px; text-align:center; color:var(--text-dim); font-size:13px;}
.file-drop svg{width:26px;height:26px; margin-bottom:6px; color:var(--gold);}
.preview-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
.preview-grid img,.preview-grid video{width:100%; height:80px; object-fit:cover; border-radius:10px;}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.btn{flex:1; padding:13px; border-radius:var(--radius-sm); font-size:14.5px; font-weight:700; text-align:center;}
.btn-primary{background:var(--gold); color:#12151b;}
.btn-ghost{background:var(--surface-2); color:var(--text);}

.settings-group{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:14px;}
.settings-group h4{margin:0 0 10px; font-size:12.5px; color:var(--text-dim); font-weight:700;}
.avatar-row{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
.avatar-big{width:74px;height:74px;border-radius:20px;object-fit:cover; border:1px solid var(--border); background:var(--surface-2);}
.switch-row{display:flex; align-items:center; justify-content:space-between; padding:8px 2px;}
.switch{width:46px;height:27px;border-radius:20px; background:var(--surface-2); border:1px solid var(--border); position:relative; flex-shrink:0;}
.switch::after{content:""; position:absolute; top:2px; inset-inline-start:2px; width:21px;height:21px;border-radius:50%; background:var(--text-dim); transition:.15s;}
.switch.on{background:var(--gold);}
.switch.on::after{background:#12151b; inset-inline-start:21px;}
.about-view{white-space:pre-wrap; font-size:13.5px; color:var(--text-dim); line-height:1.9;}
.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border); padding:11px 20px; border-radius:30px; font-size:13px; box-shadow:var(--shadow); z-index:400; opacity:0; pointer-events:none; transition:opacity .2s;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-emblem">
    <svg viewBox="0 0 24 24" fill="none" stroke="#12151b" stroke-width="2"><path d="M12 2l7 3v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V5l7-3z"/></svg>
  </div>
  <div style="text-align:center;">
    <h2 style="margin:0 0 4px;font-size:18px;">المنتصر</h2>
    <p style="margin:0;color:var(--text-dim);font-size:13px;">أدخل رمز الدخول</p>
  </div>
  <div class="pin-dots" id="pinDots"></div>
  <div id="lockError"></div>
  <div class="pin-pad" id="pinPad"></div>
</div>

<div class="screen active" id="screen-home">
  <div class="top-header">
    <div class="brand">
      <img id="homeAvatarImg" class="avatar hidden" alt="">
      <div id="homeAvatarFallback" class="avatar-fallback">م</div>
      <div>
        <h1 id="homeAppName">المنتصر</h1>
        <p id="homeTagline">خزانتك الخاصة</p>
      </div>
    </div>
    <button class="icon-btn" onclick="openSettings()" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </div>
  <div id="diagBox"></div>
  <div class="grid" id="foldersGrid">
    <button class="folder-card" style="--fc:#eab308;--fc2:#b45309" data-id="code" onclick="openFolder('code')">
      <div class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-4 4 4 4M16 9l4 4-4 4M13 5l-2 16"/></svg></div>
      <div><h3>الأكواد</h3><span class="count-label" data-folder="code">0 عنصر</span></div>
    </button>
    <button class="folder-card" style="--fc:#f59e0b;--fc2:#b45309" data-id="memories" onclick="openFolder('memories')">
      <div class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21c0-4-3.6-6-8-6s-8 2-8 6M12 12a4 4 0 100-8 4 4 0 000 8z"/></svg></div>
      <div><h3>الذكريات</h3><span class="count-label" data-folder="memories">0 عنصر</span></div>
    </button>
    <button class="folder-card" style="--fc:#f43f5e;--fc2:#9f1239" data-id="private" onclick="openFolder('private')">
      <div class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V5l7-3z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg></div>
      <div><h3>ملفات خاصة</h3><span class="count-label" data-folder="private">0 عنصر</span></div>
    </button>
    <button class="folder-card" style="--fc:#3b82f6;--fc2:#1d4ed8" data-id="projects" onclick="openFolder('projects')">
      <div class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg></div>
      <div><h3>مشاريع</h3><span class="count-label" data-folder="projects">0 عنصر</span></div>
    </button>
    <button class="folder-card" style="--fc:#ec4899;--fc2:#a21caf" data-id="mymemory" onclick="openFolder('mymemory')">
      <div class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9C.5 8 2.5 4 6.5 4c2 0 3.5 1.5 5.5 4 2-2.5 3.5-4 5.5-4 4 0 6 4 4 8-2.5 4.5-9.5 9-9.5 9z"/></svg></div>
      <div><h3>ذكرياتي</h3><span class="count-label" data-folder="mymemory">0 عنصر</span></div>
    </button>
    <button class="folder-card" style="--fc:#a855f7;--fc2:#6d28d9" data-id="media" onclick="openFolder('media')">
      <div class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="15" height="14" rx="2"/><path d="M21 8l-3 3 3 3V8z"/></svg></div>
      <div><h3>الفيديوهات والصور</h3><span class="count-label" data-folder="media">0 عنصر</span></div>
    </button>
    <button class="folder-card" style="--fc:#f2994a;--fc2:#c2570c" data-id="tambour" onclick="openFolder('tambour')">
      <div class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><circle cx="9" cy="18" r="3"/><circle cx="15" cy="16" r="3"/></svg></div>
      <div><h3>طمبور الشمال</h3><span class="count-label" data-folder="tambour">0 عنصر</span></div>
    </button>
    <button class="folder-card" style="--fc:#64748b;--fc2:#334155" data-id="other" onclick="openFolder('other')">
      <div class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></div>
      <div><h3>أخرى</h3><span class="count-label" data-folder="other">0 عنصر</span></div>
    </button>
  </div>
</div>
<noscript>
  <div style="position:fixed;bottom:0;inset-inline:0;background:#3a1f1f;color:#ffd9d3;padding:14px 18px;font-size:12.5px;text-align:center;z-index:600;">
    تنبيه: الجافاسكربت لا يعمل داخل هذا التطبيق، لذلك لا يمكن فتح الحافظات أو حفظ أي محتوى. هذه مشكلة في إعدادات تطبيق الأندرويد (WebView) وليست في هذا الملف.
  </div>
</noscript>

<div class="screen" id="screen-folder">
  <div class="detail-header">
    <button class="icon-btn" onclick="goHome()" aria-label="رجوع">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 id="folderTitle"></h2>
    <button class="icon-btn" id="folderInfoBtn" aria-label="عدد العناصر">
      <span id="folderCountBadge" style="font-size:12px;font-weight:700;color:var(--text-dim);"></span>
    </button>
  </div>
  <div class="item-list" id="itemList"></div>
</div>
<button class="fab" id="fabBtn" onclick="openAddModal()" aria-label="إضافة">
  <svg id="fabIcon" viewBox="0 0 24 24" fill="none" stroke="#12151b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="screen" id="screen-settings">
  <div class="detail-header">
    <button class="icon-btn" onclick="goHome()" aria-label="رجوع">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2>الإعدادات</h2>
  </div>

  <div class="settings-group">
    <h4>هوية التطبيق</h4>
    <div class="avatar-row">
      <img id="settingsAvatarImg" class="avatar-big hidden" alt="">
      <div id="settingsAvatarFallback" class="avatar-fallback" style="width:74px;height:74px;border-radius:20px;font-size:26px;">م</div>
      <div style="flex:1;">
        <label class="btn btn-ghost" style="display:block;" for="avatarInput">تغيير الصورة</label>
        <input type="file" id="avatarInput" accept="image/*" class="hidden">
      </div>
    </div>
    <div class="field"><label>اسم التطبيق</label><input id="setAppName" placeholder="المنتصر"></div>
    <div class="field"><label>الشعار الفرعي</label><input id="setTagline" placeholder="خزانتك الخاصة"></div>
  </div>

  <div class="settings-group">
    <h4>حول التطبيق</h4>
    <div class="field"><label>نبذة عن التطبيق</label><textarea id="setAbout" placeholder="اكتب نبذة عن هذا التطبيق..."></textarea></div>
    <div class="field"><label>الناشر</label><input id="setPublisher" placeholder="اسم الناشر"></div>
    <div class="field"><label>الإصدار</label><input id="setVersion" placeholder="1.0.0"></div>
  </div>

  <div class="settings-group">
    <h4>الحماية</h4>
    <div class="switch-row">
      <span>قفل برمز دخول (PIN)</span>
      <button class="switch" id="pinToggle" onclick="togglePin()"></button>
    </div>
    <button class="btn btn-ghost" id="changePinBtn" style="margin-top:8px;" onclick="startSetPin()">تعيين / تغيير الرمز</button>
  </div>

  <div class="settings-group">
    <h4>المظهر</h4>
    <p style="font-size:12.5px;color:var(--text-dim);margin:0;">يتبع التطبيق وضع النظام (فاتح / داكن) تلقائياً حسب إعدادات هاتفك.</p>
  </div>

  <button class="btn btn-primary" style="width:100%;" onclick="saveSettings()">حفظ الإعدادات</button>
</div>

<div class="modal-backdrop" id="addModalBackdrop">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="addModalTitle">إضافة</h3>
    <div id="addModalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAddModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="submitAddItem()">حفظ</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="viewModalBackdrop">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="viewModalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeViewModal()">إغلاق</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FOLDERS = [
  { id:'code',    name:'الأكواد',            color:'#3f9d8f', type:'code',
    icon:'<path d="M8 9l-4 4 4 4M16 9l4 4-4 4M13 5l-2 16"/>' },
  { id:'memories',name:'الذكريات',           color:'#c9a24b', type:'note',
    icon:'<path d="M20 21c0-4-3.6-6-8-6s-8 2-8 6M12 12a4 4 0 100-8 4 4 0 000 8z"/>' },
