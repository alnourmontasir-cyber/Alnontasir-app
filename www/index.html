:root{
    --bg:#070b18;
    --bg2:#0e1630;
    --surface:rgba(255,255,255,.075);
    --surface2:rgba(255,255,255,.11);
    --border:rgba(255,255,255,.12);
    --text:#f8fafc;
    --muted:#9ca9c2;
    --primary:#7c5cff;
    --secondary:#00c6ff;
    --pink:#ff3d9a;
    --green:#19d99a;
    --orange:#ffae45;
    --red:#ff5272;
    --radius:24px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    min-height:100%;
    background:var(--bg);
}

body{
    color:var(--text);
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    min-height:100vh;
    padding:
        max(14px,env(safe-area-inset-top))
        14px
        calc(92px + env(safe-area-inset-bottom));

    overflow-x:hidden;

    background:
        radial-gradient(circle at 5% 5%,rgba(124,92,255,.25),transparent 28%),
        radial-gradient(circle at 95% 15%,rgba(0,198,255,.18),transparent 27%),
        radial-gradient(circle at 50% 100%,rgba(255,61,154,.15),transparent 35%),
        var(--bg);
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    border:0;
}

button:active{
    transform:scale(.97);
}

.hidden{
    display:none!important;
}
